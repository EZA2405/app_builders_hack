<!-- Constellation: scattered points joined into a route that lands on the brightest one. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="56" fill="#0B0B14"/>
  <polyline points="54,186 92,150 82,104 136,96 176,74" fill="none" stroke="#F4F4F8" stroke-opacity=".5" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#F4F4F8"><circle cx="54" cy="186" r="7"/><circle cx="92" cy="150" r="7"/><circle cx="82" cy="104" r="7"/><circle cx="136" cy="96" r="7"/></g>
  <circle cx="176" cy="74" r="12" fill="#F08A24"/>
  <circle cx="176" cy="74" r="30" fill="none" stroke="#F08A24" stroke-width="7"/>
</svg>
