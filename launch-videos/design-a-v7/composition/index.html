<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Gabay — v7 "Tatlong problema" (three screens)</title>
    <script src="assets/gsap.min.js"></script>
    <script src="assets/audio-level.js"></script>
    <style>
      /* Design A tokens; footage is v6's render (../design-a-v6), cropped to the Mac window */
      :root { --beacon: #f08a24; --beacon-type: #c8650a; --done: #2fa35a; --done-ink: #1f7a41; --ink: #1c1c1e; --ink-soft: #48484d; --stage: #f3eee7;
        --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--stage); }
      body { font-family: var(--sf); color: var(--ink); -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--stage); }
      .blob { position: absolute; border-radius: 50%; filter: blur(120px); }
      #blob1 { left: -260px; top: 480px; width: 1000px; height: 760px; background: rgba(176, 190, 236, 0.55); }
      #blob2 { right: -260px; top: -180px; width: 1000px; height: 820px; background: rgba(246, 176, 120, 0.5); }

      .k { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; font-size: 84px; line-height: 96px; font-weight: 600; letter-spacing: -0.03em; }
      .k .w { display: inline-block; opacity: 0; }
      .acc { color: var(--beacon-type); }

      .panel { position: absolute; top: 330px; width: 600px; height: 378px; border-radius: 18px; overflow: hidden; opacity: 0; background: #f3eee7;
        box-shadow: 0 30px 70px rgba(80, 56, 30, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.06); }
      .panel video { position: absolute; left: 0; top: 0; width: 600px; height: 378px; object-fit: cover; }
      .frame { position: absolute; inset: 0; border-radius: 18px; box-shadow: inset 0 0 0 5px var(--done); opacity: 0; }
      .lab { position: absolute; top: 272px; width: 600px; font-size: 30px; font-weight: 600; color: var(--ink-soft); opacity: 0; display: flex; gap: 12px; align-items: center; }
      .lab i { width: 12px; height: 12px; border-radius: 50%; background: var(--beacon); }
      .fixed { position: absolute; top: 730px; width: 600px; display: flex; justify-content: center; opacity: 0; }
      .fixed span { padding: 10px 24px; border-radius: 30px; background: var(--done); color: #fff; font-size: 28px; font-weight: 700; box-shadow: 0 12px 30px rgba(47, 163, 90, 0.35); }
      #full { position: absolute; inset: 0; opacity: 0; }
      #full video { width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="24.8">
      <div id="blob1" class="blob" data-layout-ignore></div>
      <div id="blob2" class="blob" data-layout-ignore></div>

      <div data-layout-allow-overlap class="k" id="t1" style="top: 110px">Isang linggo. <span class="acc">Tatlong problema.</span></div>
      <div data-layout-allow-overlap class="k" id="t2" style="top: 110px">Walang tawag <span class="acc">kay Sam.</span></div>

      <div class="lab" id="lab1" style="left: 30px"><i></i>Monday · Wi‑Fi</div>
      <div class="lab" id="lab2" style="left: 660px"><i></i>Wednesday · Storage</div>
      <div class="lab" id="lab3" style="left: 1290px"><i></i>Friday · Headphones</div>

      <div id="panels">
        <div class="panel" id="pn1" style="left: 30px"><video id="v1" src="assets/seg1.mp4" muted playsinline data-start="0.6" data-duration="13.1" data-track-index="0"></video><div class="frame" id="f1"></div></div>
        <div class="panel" id="pn2" style="left: 660px"><video id="v2" src="assets/seg2.mp4" muted playsinline data-start="0.6" data-duration="13.1" data-track-index="1"></video><div class="frame" id="f2"></div></div>
        <div class="panel" id="pn3" style="left: 1290px"><video id="v3" src="assets/seg3.mp4" muted playsinline data-start="0.6" data-duration="13.1" data-track-index="2"></video><div class="frame" id="f3"></div></div>
      </div>
      <div class="fixed" id="x1" style="left: 30px"><span>✓ Fixed. Kaya niya.</span></div>
      <div class="fixed" id="x2" style="left: 660px"><span>✓ Fixed. Kaya niya.</span></div>
      <div class="fixed" id="x3" style="left: 1290px"><span>✓ Fixed. Kaya niya.</span></div>

      <!-- climax + end card, straight from v6 -->
      <div id="full"><video id="v4" src="assets/seg4.mp4" muted playsinline data-start="13.4" data-duration="11.33" data-track-index="3"></video></div>

      <audio id="bed" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3" data-start="0" data-duration="24.8" data-track-index="10" data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":0.32},{"t":23.4,"v":0.32},{"t":24.8,"v":0}]}]}'></audio>
      <audio id="s-ok3" src="assets/sfx/interface/drop_002.ogg" data-start="5.4" data-duration="0.19" data-track-index="11" data-volume="0.55"></audio>
      <audio id="s-ok2" src="assets/sfx/interface/drop_002.ogg" data-start="7.2" data-duration="0.19" data-track-index="11" data-volume="0.55"></audio>
      <audio id="s-ok1" src="assets/sfx/interface/drop_002.ogg" data-start="11.96" data-duration="0.19" data-track-index="11" data-volume="0.55"></audio>
      <audio id="s-recv" src="assets/sfx/interface/drop_002.ogg" data-start="13.67" data-duration="0.19" data-track-index="12" data-volume="0.45"></audio>
      <audio id="s-send" src="assets/sfx/interface/drop_001.ogg" data-start="15.31" data-duration="0.11" data-track-index="12" data-volume="0.55"></audio>
      <audio id="s-logo" src="assets/sfx/impact/impactBell_heavy_000.ogg" data-start="19.09" data-duration="1.48" data-track-index="13" data-volume="0.45"></audio>
    </div>

    <script>
      document.querySelectorAll(".k").forEach((el) => {
        const parts = [];
        el.childNodes.forEach((n) => {
          if (n.nodeType === 3) n.textContent.split(/\s+/).filter(Boolean).forEach((t) => parts.push({ t }));
          else n.textContent.split(/\s+/).filter(Boolean).forEach((t) => parts.push({ t, cls: n.className }));
        });
        el.innerHTML = parts.map((p) => `<span class="w${p.cls ? " " + p.cls : ""}">${p.t}</span>`).join(" ");
      });
      const tl = gsap.timeline({ paused: true });
      const words = (sel, at, gap) => document.querySelectorAll(sel + " .w").forEach((w, i) =>
        tl.fromTo(w, { opacity: 0, filter: "blur(16px)", y: 26, scale: 0.94 }, { opacity: 1, filter: "blur(0px)", y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, at + i * gap));
      const wordsOut = (sel, at) => tl.to(sel + " .w", { opacity: 0, filter: "blur(12px)", y: -14, duration: 0.35, stagger: 0.025, ease: "power2.in" }, at);

      // 0 – 3 · three problems, one week
      words("#t1", 0.15, 0.14);
      [1, 2, 3].forEach((n, i) => {
        tl.fromTo("#pn" + n, { opacity: 0, y: 80, rotationY: (i - 1) * -18, scale: 0.85, transformPerspective: 1600 },
          { opacity: 1, y: 0, rotationY: 0, scale: 1, transformPerspective: 1600, duration: 0.9, ease: "expo.out" }, 0.25 + i * 0.12);
        tl.fromTo("#lab" + n, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.6 + i * 0.12);
      });
      wordsOut("#t1", 3.6);
      words("#t2", 4.0, 0.16);

      // each screen turns green the moment Rosa finishes (seg times: headphones 4.8 s, trash 6.6 s, Wi‑Fi 11.36 s)
      [[3, 5.4], [2, 7.2], [1, 11.96]].forEach(([n, at]) => {
        tl.fromTo("#f" + n, { opacity: 0 }, { opacity: 1, duration: 0.3 }, at);
        tl.to("#pn" + n, { scale: 1.04, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, at);
        tl.fromTo("#x" + n, { opacity: 0, y: 20, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2)" }, at + 0.05);
      });
      // the screens gently drift while they play
      tl.to("#panels", { y: -10, duration: 5.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.6);

      // 13.0 · fold into the climax
      wordsOut("#t2", 13.0);
      tl.to(["#lab1", "#lab2", "#lab3", "#x1", "#x2", "#x3"], { opacity: 0, y: -10, duration: 0.3, stagger: 0.02 }, 13.0);
      [1, 2, 3].forEach((n, i) => tl.to("#pn" + n, { x: (1 - i) * 630, scale: 0.5, opacity: 0, duration: 0.55, ease: "power3.in" }, 13.1));
      tl.fromTo("#full", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 13.4);

      const L = window.AUDIO_LEVEL || [];
      for (let f = 0; f < Math.min(L.length, 720); f++) tl.call(((v) => () => gsap.set(["#blob1", "#blob2"], { opacity: 0.55 + 0.45 * v }))(L[f]), [], f / 30);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
